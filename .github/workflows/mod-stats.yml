name: Mod stats card

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: mod-stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ffmpeg
        if: hashFiles('.github/mod-stats/background.webp') == ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Build card
        timeout-minutes: 10
        run: node .github/mod-stats/build.mjs

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/mod-stats
          git diff --cached --quiet && exit 0
          git commit -m "chore: update mod stats card"
          for attempt in 1 2 3; do
            git pull --rebase -X theirs origin "$GITHUB_REF_NAME" && git push && exit 0
            sleep 5
          done
          exit 1
