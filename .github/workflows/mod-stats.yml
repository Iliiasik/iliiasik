name: Mod stats card

on:
  schedule:
    - cron: "0 6,18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: mod-stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEBIAN_FRONTEND: noninteractive
      OUT_DIR: out
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore previous output
        run: |
          mkdir -p out
          if git fetch --depth=1 origin output; then
            git archive FETCH_HEAD | tar -x -C out
          fi
          find out -type f | sort | xargs -r sha256sum > "$RUNNER_TEMP/before.sha"

      - name: Install ffmpeg
        if: hashFiles('out/background.webp') == ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Build card
        timeout-minutes: 10
        run: node .github/mod-stats/build.mjs

      - name: Publish to output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find out -type f | sort | xargs -r sha256sum > "$RUNNER_TEMP/after.sha"
          if cmp -s "$RUNNER_TEMP/before.sha" "$RUNNER_TEMP/after.sha"; then
            echo "nothing changed"
            exit 0
          fi
          cd out
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Update mod stats card"
          git push -f -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
